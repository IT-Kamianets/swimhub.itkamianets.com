<header
	class="relative z-40 border-b border-[var(--c-border)] bg-[var(--c-bg-secondary)]/95 backdrop-blur supports-[backdrop-filter]:bg-[var(--c-bg-secondary)]/80"
>
	<div
		class="mx-auto flex min-h-16 w-full max-w-[var(--container)] items-center justify-between px-4 py-3 sm:px-6"
	>
		<a
			aria-label="Go to homepage"
			class="inline-flex items-center gap-2 text-xs font-semibold tracking-[0.18em] text-[var(--c-text-secondary)] uppercase"
			routerLink="/"
		>
			<span class="material-symbols-outlined text-[22px] text-[var(--c-secondary)]" aria-hidden="true">
				pool
			</span>
			Swim Guide
		</a>

		<div class="flex items-center gap-2">
			<div
				class="hidden items-center gap-1 rounded-full border border-[var(--c-border)] bg-[var(--c-bg-primary)] p-1 sm:flex"
			>
				@for (language of languages(); track language.code) {
					<button
						class="inline-flex h-9 items-center gap-2 rounded-full px-3 text-sm font-semibold text-[var(--c-text-muted)] transition-colors duration-200 hover:bg-[var(--c-bg-tertiary)]"
						[class.!bg-[var(--c-secondary)]]="currentLanguage().code === language.code"
						[class.!text-white]="currentLanguage().code === language.code"
						[attr.aria-label]="('Switch language to' | swimTranslate) + ' ' + language.label"
						(click)="setLanguage(language)"
						type="button"
					>
						<img
							class="h-5 w-7 rounded-[4px] border border-black/10 object-cover"
							[alt]="language.label"
							[src]="'/' + language.flagSrc"
							width="28"
							height="20"
						/>
						<span>{{ language.code.toUpperCase() }}</span>
					</button>
				}
			</div>

			<select
				class="h-11 rounded-full border border-[var(--c-border)] bg-[var(--c-bg-primary)] px-3 text-sm font-semibold text-[var(--c-text-secondary)] sm:hidden"
				[aria-label]="'Open language menu' | swimTranslate"
				[value]="currentLanguage().code"
				(change)="setLanguage(languages()[($any($event.target).selectedIndex)])"
			>
				@for (language of languages(); track language.code) {
					<option [value]="language.code">{{ language.label }}</option>
				}
			</select>

			<button
				class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-[var(--c-border)] bg-[var(--c-bg-primary)] text-[var(--c-text-secondary)] transition-colors duration-200 hover:bg-[var(--c-bg-tertiary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--c-primary)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--c-bg-secondary)]"
				[attr.aria-label]="toggleLabel() | swimTranslate"
				(click)="toggleMode()"
				type="button"
			>
				<span class="material-symbols-outlined text-[22px]" aria-hidden="true">
					{{ toggleIcon() }}
				</span>
			</button>
		</div>
	</div>
</header>
