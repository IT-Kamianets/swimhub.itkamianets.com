<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Swim Guide | Learn Swimming, Training, and Water Safety</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const storedMode = localStorage.getItem('app-mode');
				const preferredMode =
					storedMode === 'dark' || storedMode === 'light'
						? storedMode
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-mode', preferredMode);
			} catch {}
		</script>

		<meta
			name="description"
			content="Swim Guide is a simple educational app for beginners who want to learn swimming basics, strokes, training plans, safety rules, health benefits, glossary terms, and famous swimmers."
		/>
		<meta
			name="keywords"
			content="swimming, swim guide, learn swimming, swimming styles, swim safety, training plans, swimming glossary"
		/>
		<meta name="author" content="Swim Guide" />
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#edf9fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#071923" media="(prefers-color-scheme: dark)" />

		<meta itemprop="name" content="Swim Guide" />
		<meta
			itemprop="description"
			content="A beginner-friendly swimming guide with static educational pages for basics, styles, plans, safety, health, glossary, and famous swimmers."
		/>
		<meta itemprop="image" content="/assets/logo.png" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Swim Guide" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:title" content="Swim Guide" />
		<meta
			property="og:description"
			content="Learn swimming, train smarter, and stay safe in the water."
		/>
		<meta property="og:image" content="/assets/logo.png" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Swim Guide" />
		<meta
			name="twitter:description"
			content="Learn swimming, train smarter, and stay safe in the water."
		/>
		<meta name="twitter:image" content="/assets/logo.png" />

		<link rel="canonical" href="/" />
		<link rel="icon" type="image/x-icon" href="favicon.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
			rel="stylesheet"
		/>
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
